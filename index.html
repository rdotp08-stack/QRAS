
<!DOCTYPE html>
<html>
<head>
    <title>Advanced Barcode Attendance System</title>

    <!-- Barcode Generator -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- Barcode Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <style>
        body { font-family: Arial; text-align: center; margin: 20px; }
        #scanner-container { width: 100%; max-width: 500px; margin: auto; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #333; padding: 8px; }
        th { background-color: #f2f2f2; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Barcode Attendance System</h2>

<h3>Add Student</h3>
<input type="text" id="studentName" placeholder="Enter Student Name">
<button onclick="addStudent()">Add Student</button>

<h3>Generated Students</h3>
<div id="studentList"></div>

<h3>Scan Barcode</h3>
<div id="scanner-container"></div>
<p id="scanResult">Waiting for scan...</p>

<h3>Attendance Log</h3>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Student ID</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody id="attendanceTable"></tbody>
</table>

<script>

let students = {};
let studentCounter = 1;

// Add Student and auto-generate ID
function addStudent() {
    const name = document.getElementById("studentName").value.trim();
    if (!name) return alert("Enter student name");

    const id = "STU" + String(studentCounter).padStart(4, "0");
    studentCounter++;

    students[id] = name;

    const container = document.createElement("div");
    container.innerHTML = `
        <p><strong>${name}</strong> (${id})</p>
        <svg id="barcode-${id}"></svg>
        <hr>
    `;

    document.getElementById("studentList").appendChild(container);

    JsBarcode(`#barcode-${id}`, id, {
        format: "CODE128",
        width: 2,
        height: 40
    });

    document.getElementById("studentName").value = "";
}

// Initialize Barcode Scanner
Quagga.init({
    inputStream: {
        type: "LiveStream",
        target: document.querySelector('#scanner-container'),
        constraints: { facingMode: "environment" }
    },
    decoder: {
        readers: ["code_128_reader"]
    }
}, function(err) {
    if (err) {
        console.error(err);
        return;
    }
    Quagga.start();
});

// On Scan
Quagga.onDetected(function(data) {
    const code = data.codeResult.code;
    document.getElementById("scanResult").innerText = "Scanned: " + code;

    if (students[code]) {
        logAttendance(code, students[code]);
        playBeep();
    } else {
        alert("Student not found!");
    }
});

function logAttendance(id, name) {
    const table = document.getElementById("attendanceTable");
    const row = table.insertRow();
    row.insertCell(0).innerText = name;
    row.insertCell(1).innerText = id;
    row.insertCell(2).innerText = new Date().toLocaleString();
}

function playBeep() {
    const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    beep.play();
}

</script>

</body>
</html>
